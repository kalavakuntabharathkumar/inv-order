services:
 mysql:
  image: mysql:8.4
  environment:
   MYSQL_ROOT_PASSWORD: root
  ports: ["3306:3306"]
 user-service:
  build: ./user-service
  depends_on: [mysql]
  ports: ["8081:8081"]
 inventory-service:
  build: ./inventory-service
  depends_on: [mysql]
  ports: ["8082:8082"]
 order-service:
  build: ./order-service
  depends_on: [mysql, inventory-service]
  ports: ["8083:8083"]
